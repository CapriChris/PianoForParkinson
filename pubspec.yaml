name: piano_practice
description: 琴伴 — internal Android prototype for piano practice.
publish_to: none
version: 0.1.59+60
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: 2.4.4+2
  crypto: 3.0.7
  unorm_dart: 0.3.3
  video_player: 2.14.1
  image_picker: ^1.2.1
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  camera: ^0.12.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: ^2.4.5
  video_player_platform_interface: 6.9.0
  camera_platform_interface: ^2.15.0
flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/content/
    - assets/audio/
    - assets/i18n/
    - assets/ui_images/
    - assets/video/fandango-lesson-4.webm
    - assets/video/balance-six-part-1.mp4
    - assets/video/balance-six-part-2.mp4
    - assets/video/balance-six-part-3.mp4
